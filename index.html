<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Miraitowa 的个人空间：博客、项目与关于我。">
  <title>Miraitowa Hub · Hello, world</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101820; color: #edf3f6; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 960px; margin: auto; padding: 48px 24px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: center; }
    nav { display: flex; gap: 20px; flex-wrap: wrap; }
    a { color: #a4e8d0; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #a4e8d0; outline-offset: 6px; }
    .hero { padding: 90px 0 64px; }
    .eyebrow { color: #a4e8d0; letter-spacing: .12em; }
    h1 { font-size: clamp(44px, 8vw, 80px); line-height: 1.1; margin: 24px 0; }
    p { color: #b6c5ce; line-height: 1.8; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    section { border-top: 1px solid #34434e; padding-top: 16px; scroll-margin-top: 24px; }
    h2 { font-size: 22px; }
    footer { margin-top: 64px; border-top: 1px solid #34434e; padding-top: 24px; }
    @media (max-width: 640px) { header { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: 1fr; } .hero { padding-top: 56px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <strong>MIRAITOWA / HUB</strong>
      <nav aria-label="主导航"><a href="#blog">博客</a><a href="#projects">项目</a><a href="#about">关于我</a></nav>
    </header>
    <div class="hero">
      <p class="eyebrow">个人网站 · DEMO 01</p>
      <h1>Hello, world.<br>这里是 Miraitowa。</h1>
      <p>记录想法，展示项目，分享探索。<br>这是个人网站的第一个 Demo，先让每一次更新都能抵达服务器。</p>
      <a href="https://github.com/Miraitowa-la/miraitowa-hub">查看 GitHub 仓库 ↗</a>
    </div>
    <div class="grid">
      <section id="blog"><h2>01 / 博客</h2><p>文章空间即将上线。这里将用来记录学习、实践与思考。</p></section>
      <section id="projects"><h2>02 / 项目</h2><p>第一个项目就是这个网站。从一个简单页面开始，逐步搭建个人空间。</p></section>
      <section id="about"><h2>03 / 关于我</h2><p>你好，我是 Miraitowa。更多个人介绍将在后续版本补充。</p></section>
    </div>
    <footer><p>Miraitowa Hub · 首个部署 Demo</p><a href="/revision.txt">查看当前部署的提交编号</a></footer>
  </main>
</body>
</html>
